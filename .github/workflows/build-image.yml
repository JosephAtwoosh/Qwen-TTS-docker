name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/josephatwoosh/qwen-tts-docker

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No GPU on the runner: import the stack and run the unit tests, which
      # use the mock engine. This catches a broken dependency pin or a syntax
      # error before a paid instance ever boots.
      - name: smoke test
        run: |
          TAG="$IMAGE:sha-${GITHUB_SHA::7}"
          docker run --rm "$TAG" python -c "import torch, qwen_tts, fastapi; print('torch', torch.__version__)"
          docker run --rm "$TAG" test
